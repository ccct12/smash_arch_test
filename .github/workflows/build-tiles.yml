# 지도 타일 만들기 — 한국 OSM 파일에서 건축사사무소 주변만 잘라 tiles/ 를 만들고
# 릴리스 'tiles-latest' 에 tiles.tar 로 올린 뒤, '사이트 배포'가 이어서 돌아요.
# 실행: 저장소 → Actions → 지도 타일 만들기 → Run workflow  (매월 2일 새벽에도 자동 실행)
name: 지도 타일 만들기
on:
  workflow_dispatch:
    inputs:
      radius:
        description: '사무소 주변 몇 m까지 (기본 750)'
        required: false
        default: '750'
  schedule:
    - cron: '17 18 1 * *'   # 매월 2일 03:17 (한국 시간)
permissions:
  contents: write
concurrency:
  group: build-tiles
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: 도구 설치
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          python3 -m pip install --quiet osmium
      - name: 한국 OSM 파일 받기 (Geofabrik)
        run: |
          curl -fsSL --retry 3 -o korea.osm.pbf https://download.geofabrik.de/asia/south-korea-latest.osm.pbf
          ls -lh korea.osm.pbf
          echo "OSM_DATE=$(osmium fileinfo -g header.option.osmosis_replication_timestamp korea.osm.pbf || date -u +%F)" >> $GITHUB_ENV
      - name: 게임에 필요한 것만 거르기
        run: |
          osmium tags-filter korea.osm.pbf \
            w/building w/highway w/landuse w/leisure w/natural w/office w/name \
            n/natural=tree n/office=architect n/name \
            -o filtered.osm.pbf --overwrite
          ls -lh filtered.osm.pbf
      - name: 타일 만들기
        run: python3 -u tools/build_tiles.py --pbf filtered.osm.pbf --out out --radius "${{ github.event.inputs.radius || '750' }}" --osm-date "$OSM_DATE"
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C out -cf tiles.tar tiles
          ls -lh tiles.tar
          gh release view tiles-latest >/dev/null 2>&1 || gh release create tiles-latest --title "지도 타일" --notes "build-tiles 워크플로가 자동으로 갱신하는 지도 타일입니다. 직접 지우지 마세요."
          gh release upload tiles-latest tiles.tar --clobber
